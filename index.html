<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcast Fighter II Turbo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      font-family: 'Arial', sans-serif;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Logo Section */
    .logo-section {
      text-align: center;
      margin-bottom: 60px;
    }

    .logo {
      max-width: 500px;
      height: auto;
      margin: 0 auto 30px;
      filter: drop-shadow(0 0 20px rgba(255, 137, 171, 0.5));
    }

    /* Input Section */
    .input-section {
      max-width: 600px;
      margin: 0 auto 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .input-box {
      display: flex;
      flex-direction: column;
    }

    .input-box input {
      padding: 15px;
      border: 2px solid #ff89ab;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 14px;
      border-radius: 4px;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    .input-box input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .input-box input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 20px rgba(255, 137, 171, 0.3);
    }

    /* Button */
    .btn-container {
      text-align: center;
      margin-bottom: 60px;
    }

    .btn-insert-coin {
      padding: 20px 60px;
      font-size: 24px;
      font-weight: bold;
      text-transform: uppercase;
      background: linear-gradient(45deg, #ff89ab, #ffd709);
      border: 3px solid #fff;
      color: #000;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s;
      box-shadow: 0 0 30px rgba(255, 137, 171, 0.5);
      letter-spacing: 2px;
    }

    .btn-insert-coin:hover {
      transform: scale(1.05);
      box-shadow: 0 0 50px rgba(255, 137, 171, 0.8);
    }

    .btn-insert-coin:active {
      transform: scale(0.95);
    }

    /* Results Section */
    .results-section {
      display: none;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Podcast Cards */
    .podcast-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 60px;
    }

    .podcast-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid #ff89ab;
      padding: 30px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
      text-align: center;
      transition: all 0.3s;
    }

    .podcast-card:hover {
      border-color: #ffd709;
      box-shadow: 0 0 30px rgba(255, 215, 9, 0.3);
    }

    .podcast-image {
      width: 200px;
      height: 200px;
      margin: 0 auto 20px;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
    }

    .podcast-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .podcast-title {
      font-size: 1.5em;
      font-weight: bold;
      margin-bottom: 15px;
      color: #ff89ab;
    }

    .podcast-description {
      font-size: 0.95em;
      color: #ccc;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    .podcast-episodes-count {
      font-size: 0.9em;
      color: #ffd709;
      font-weight: bold;
    }

    /* Episodes Today Section */
    .episodes-today {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid #ffd709;
      padding: 30px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
      margin-bottom: 60px;
    }

    .section-title {
      font-size: 1.3em;
      font-weight: bold;
      margin-bottom: 20px;
      color: #ffd709;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .episodes-list {
      text-align: left;
    }

    .episode-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      margin-bottom: 10px;
      border-left: 3px solid #ff89ab;
      border-radius: 4px;
      font-size: 0.9em;
      line-height: 1.5;
    }

    .episodes-list:nth-child(2) .episode-item {
      border-left-color: #ffd709;
    }

    .avg-duration {
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 4px;
      text-align: center;
      font-size: 1.2em;
    }

    .duration-value {
      font-size: 2em;
      font-weight: bold;
      color: #ff89ab;
      margin: 10px 0;
    }

    .episodes-list:nth-child(2) .duration-value {
      color: #ffd709;
    }

    /* Timeline Section */
    .timeline-section {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid #ff89ab;
      padding: 30px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
      margin-bottom: 60px;
    }

    .timeline-container {
      display: flex;
      gap: 15px;
      align-items: flex-end;
      margin-top: 30px;
      height: 200px;
      overflow-x: auto;
    }

    .timeline-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-width: 60px;
    }

    .bar-label {
      font-size: 0.8em;
      text-align: center;
      width: 60px;
      order: 3;
      color: #ccc;
    }

    .bar-container {
      width: 60px;
      height: 150px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      display: flex;
      gap: 4px;
      padding: 4px;
      order: 2;
    }

    .bar {
      flex: 1;
      border-radius: 2px;
      transition: all 0.3s;
    }

    .bar-1 {
      background: linear-gradient(180deg, #ff89ab, #ff6b8f);
    }

    .bar-2 {
      background: linear-gradient(180deg, #ffd709, #efc900);
    }

    .bar:hover {
      filter: brightness(1.2);
    }

    .bar-count {
      font-size: 0.85em;
      font-weight: bold;
      order: 1;
      color: #fff;
    }

    /* Heatmap Section */
    .heatmap-section {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid #ffd709;
      padding: 30px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }

    .heatmap-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-top: 30px;
    }

    .heatmap-column h4 {
      margin-bottom: 15px;
      color: #ff89ab;
    }

    .heatmap-column:nth-child(2) h4 {
      color: #ffd709;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s;
      cursor: default;
    }

    .day-label {
      font-size: 0.7em;
      color: #999;
      margin-top: 5px;
    }

    .day-count {
      font-size: 1.2em;
      font-weight: bold;
    }

    .day-cell:hover {
      border-color: #ff89ab;
      box-shadow: 0 0 15px rgba(255, 137, 171, 0.3);
    }

    .error {
      color: #ff6e84;
      padding: 15px;
      background: rgba(255, 110, 132, 0.1);
      border-radius: 4px;
      border: 1px solid #ff6e84;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      .podcast-cards, .episodes-grid, .heatmap-grid {
        grid-template-columns: 1fr;
      }

      .logo {
        max-width: 300px;
      }

      .btn-insert-coin {
        padding: 15px 40px;
        font-size: 18px;
      }

      .timeline-container {
        height: 150px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logo Section -->
    <div class="logo-section">
      <svg class="logo" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ff89ab;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ffd709;stop-opacity:1" />
          </linearGradient>
        </defs>
        <style>
          .arcade-text {
            font-size: 80px;
            font-weight: 900;
            font-family: Arial Black, sans-serif;
            fill: url(#grad1);
            text-shadow: 2px 2px 0 #000, 4px 4px 0 rgba(0,0,0,0.3);
            letter-spacing: 2px;
          }
          .turbo-text {
            font-size: 60px;
          }
        </style>
        <text x="300" y="90" text-anchor="middle" class="arcade-text">PODCAST</text>
        <text x="300" y="170" text-anchor="middle" class="arcade-text">FIGHTER II</text>
        <text x="450" y="230" text-anchor="middle" class="arcade-text turbo-text">TURBO</text>
      </svg>
    </div>

    <!-- Input Section -->
    <div class="input-section">
      <div class="input-box">
        <input type="text" id="rss-1" placeholder="Podcast 1 RSS Feed URL...">
      </div>
      <div class="input-box">
        <input type="text" id="rss-2" placeholder="Podcast 2 RSS Feed URL...">
      </div>
    </div>

    <!-- Insert Coin Button -->
    <div class="btn-container">
      <button class="btn-insert-coin" onclick="loadBoth()">INSERT COIN</button>
      <div id="error-msg" style="margin-top: 20px;"></div>
    </div>

    <!-- Results Section -->
    <div class="results-section" id="results">
      <!-- Podcast Cards -->
      <div class="podcast-cards" id="podcast-cards"></div>

      <!-- Episodes Today -->
      <div class="episodes-today" id="episodes-today-section" style="display: none;">
        <div class="section-title">📻 Episodes Released Today</div>
        <div class="episodes-grid" id="episodes-grid"></div>
        <div style="margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div style="text-align: center;">
            <div style="color: #ccc; margin-bottom: 10px;">Average Duration (Today)</div>
            <div class="duration-value" id="avg-duration-1">-</div>
          </div>
          <div style="text-align: center;">
            <div style="color: #ccc; margin-bottom: 10px;">Average Duration (Today)</div>
            <div class="duration-value" id="avg-duration-2" style="color: #ffd709;">-</div>
          </div>
        </div>
      </div>

      <!-- Timeline -->
      <div class="timeline-section" id="timeline-section" style="display: none;">
        <div class="section-title">📈 Last 7 Days Comparison</div>
        <div class="timeline-container" id="timeline"></div>
      </div>

      <!-- Heatmap -->
      <div class="heatmap-section" id="heatmap-section" style="display: none;">
        <div class="section-title">📅 Most Active Days (Last 10 Days)</div>
        <div class="heatmap-grid" id="heatmap"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
