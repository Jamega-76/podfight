<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podfight·2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafafa;
    --surface:#ffffff;
    --ink:#111111;
    --muted:#96968f;
    --line:#e9e9e4;
    --accent:#2451ff;
    --err:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;}

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 28px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  .logo{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.02em;
  }
  .logo span{color:var(--accent);}
  .tagline{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.02em;
  }

  .progress-line{
    height:2px;
    background:var(--line);
    position:relative;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .2s ease;
  }

  .container{
    max-width:760px;
    margin:0 auto;
    padding:0 20px;
  }

  /* --- Input box --- */
  .input-zone{
    padding:36px 4px 0;
  }
  .input-row{
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:2px solid var(--ink);
    padding-bottom:12px;
  }
  .input-row input{
    flex:1;
    border:none;
    outline:none;
    background:none;
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    color:var(--ink);
    padding:4px 0;
  }
  .input-row input::placeholder{color:var(--muted);}
  .input-row button{
    flex-shrink:0;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    background:var(--ink);
    color:#fff;
    border:none;
    padding:10px 16px;
    border-radius:4px;
    cursor:pointer;
  }
  .input-row button:hover{background:var(--accent);}
  .input-row button:disabled{background:var(--muted); cursor:default;}

  .status-msg{
    padding:12px 4px 0;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--muted);
    min-height:18px;
  }
  .status-msg.err{color:var(--err);}

  /* --- Result header --- */
  .result-head{
    display:none;
    align-items:flex-start;
    gap:16px;
    padding:26px 4px 0;
  }
  .result-head.show{display:flex;}
  .result-cover{
    width:64px;
    height:64px;
    flex-shrink:0;
    border-radius:6px;
    object-fit:cover;
    background:var(--line);
    border:1px solid var(--line);
  }
  .result-cover[src=""],
  .result-cover:not([src]){display:none;}
  .result-body{min-width:0;}
  .result-title{
    font-size:18px;
    font-weight:700;
    line-height:1.3;
  }
  .result-feedlink{
    display:inline-block;
    margin-top:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--accent);
    text-decoration:none;
    word-break:break-all;
  }
  .result-feedlink:hover{text-decoration:underline;}

  /* --- Stats (7-day breakdown) --- */
  .stats{
    display:none;
    grid-template-columns:repeat(7,1fr);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    margin-top:22px;
  }
  .stats.show{display:grid;}
  .stat{
    padding:20px 2px 16px;
    text-align:center;
    border-right:1px solid var(--line);
  }
  .stat:last-child{border-right:none;}
  .stat-num{
    font-family:'JetBrains Mono',monospace;
    font-size:22px;
    font-weight:700;
    line-height:1;
  }
  .stat-label{
    margin-top:7px;
    font-size:9.5px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .stat.is-today .stat-num{color:var(--accent);}
  .stat.is-today .stat-label{color:var(--accent);}

  /* --- Today's episode list --- */
  .list-head{
    display:none;
    padding:22px 4px 0;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .list-head.show{display:block;}
  .list{margin-top:6px;}
  .row{
    display:flex;
    align-items:baseline;
    gap:16px;
    padding:14px 4px;
    border-bottom:1px solid var(--line);
  }
  .row-time{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--muted);
    width:40px;
    flex-shrink:0;
  }
  .row-body{flex:1; min-width:0;}
  .row-title{
    font-size:14.5px;
    font-weight:500;
    line-height:1.35;
    color:var(--ink);
  }
  .row-duration{
    margin-top:3px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
  }
  .row-link{
    flex-shrink:0;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--accent);
    text-decoration:none;
    white-space:nowrap;
  }
  .row-link:hover{text-decoration:underline;}

  .empty{
    padding:40px 0;
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
  }

  /* --- History --- */
  .history{
    margin-top:56px;
    padding:20px 4px 48px;
    border-top:1px solid var(--line);
  }
  .history-head{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:14px;
  }
  .history-empty{
    font-size:13px;
    color:var(--muted);
  }
  .history-list{
    display:flex;
    flex-direction:column;
  }
  .history-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 4px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .history-item:hover .history-url{color:var(--accent);}
  .history-name{
    font-size:13px;
    font-weight:600;
    flex-shrink:0;
    max-width:40%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .history-url{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .history-remove{
    flex-shrink:0;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    padding:4px 6px;
  }
  .history-remove:hover{color:var(--err);}

  /* --- Comparateur --- */
  .compare{
    margin-top:8px;
    padding:20px 4px 56px;
    border-top:1px solid var(--line);
  }
  .compare-selects{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .compare-select{
    flex:1;
    min-width:0;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:4px;
    padding:10px 10px;
    cursor:pointer;
  }
  .compare-vs{
    flex-shrink:0;
    font-size:11px;
    color:var(--muted);
  }

  .compare-result{margin-top:8px;}
  .compare-head-row{
    display:grid;
    grid-template-columns:200px repeat(7,1fr);
    padding:10px 4px 6px;
  }
  .compare-head-row .compare-daylabel{
    text-align:center;
    font-size:9.5px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .compare-head-row .compare-daylabel.is-today{color:var(--accent);}

  .compare-row{
    display:grid;
    grid-template-columns:200px repeat(7,1fr);
    align-items:center;
    padding:12px 4px;
    border-top:1px solid var(--line);
  }
  .compare-podcast{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .compare-cover{
    width:34px;
    height:34px;
    flex-shrink:0;
    border-radius:5px;
    object-fit:cover;
    background:var(--line);
    border:1px solid var(--line);
  }
  .compare-cover[src=""],
  .compare-cover:not([src]){visibility:hidden;}
  .compare-podcast-name{
    font-size:13px;
    font-weight:600;
    line-height:1.3;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .compare-cell{
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    font-weight:700;
  }
  .compare-cell.is-today{color:var(--accent);}

  @media (max-width:640px){
    .compare-head-row, .compare-row{grid-template-columns:120px repeat(7,1fr);}
    .compare-cover{width:26px; height:26px;}
    .compare-podcast-name{font-size:12px;}
    .compare-cell{font-size:13px;}
  }

</style>
</head>
<body>

<header>
  <div class="logo">PODFIGHT<span>·2</span></div>
  <div class="tagline mono">analyse de flux RSS</div>
</header>
<div class="progress-line"><div class="progress-fill" id="progress"></div></div>

<div class="container">

  <div class="input-zone">
    <div class="input-row">
      <input type="text" id="feed-input" placeholder="Coller l'URL d'un flux RSS podcast…" autocomplete="off">
      <button id="analyze-btn" onclick="analyze()">Analyser</button>
    </div>
    <div class="status-msg" id="status-msg"></div>
  </div>

  <div class="result-head" id="result-head">
    <img class="result-cover" id="result-cover" alt="">
    <div class="result-body">
      <div class="result-title" id="result-title"></div>
      <a class="result-feedlink" id="result-feedlink" href="#" target="_blank" rel="noopener"></a>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="list-head" id="list-head">Épisodes du jour</div>
  <div class="list" id="content-area"></div>

  <div class="history">
    <div class="history-head">Flux déjà analysés</div>
    <div id="history-container"><div class="history-empty">Aucun flux analysé pour l'instant</div></div>
  </div>

  <div class="compare">
    <div class="history-head">Comparer deux flux</div>
    <div class="compare-selects">
      <select id="compare-select-a" class="compare-select" onchange="onCompareSelectChange()">
        <option value="">Choisir un podcast…</option>
      </select>
      <span class="compare-vs mono">vs</span>
      <select id="compare-select-b" class="compare-select" onchange="onCompareSelectChange()">
        <option value="">Choisir un podcast…</option>
      </select>
    </div>
    <div class="status-msg" id="compare-status"></div>
    <div class="compare-result" id="compare-result"></div>
  </div>

</div>

<script>
  const HISTORY_KEY = 'podfight_history';
  const DAY_NAMES = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];

  function isSameDay(d1, d2) {
    return d1.getDate() === d2.getDate() &&
           d1.getMonth() === d2.getMonth() &&
           d1.getFullYear() === d2.getFullYear();
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : str;
    return d.innerHTML;
  }

  function setProgress(pct) {
    document.getElementById('progress').style.width = pct + '%';
  }

  function setStatus(msg, isErr) {
    const el = document.getElementById('status-msg');
    el.textContent = msg || '';
    el.classList.toggle('err', !!isErr);
  }

  // --- Récupération du flux avec repli sur proxies CORS ---
  const PROXY_BUILDERS = [
    url => url,
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
    url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
  ];

  async function fetchFeedText(url) {
    let lastErr = null;
    for (const build of PROXY_BUILDERS) {
      const target = build(url);
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);
        const res = await fetch(target, { signal: controller.signal });
        clearTimeout(timeout);
        if (!res.ok) { lastErr = 'HTTP ' + res.status; continue; }
        let text = await res.text();
        if (target.includes('allorigins.win/get')) {
          try { text = JSON.parse(text).contents || ''; } catch (e) { continue; }
        }
        if (text && text.includes('<')) return text;
        lastErr = 'Réponse vide';
      } catch (e) {
        lastErr = e.message || 'Échec de connexion';
      }
    }
    throw new Error(lastErr || 'Impossible de récupérer ce flux');
  }

  // --- Parsing durée (itunes:duration : "HH:MM:SS", "MM:SS" ou secondes) ---
  function formatDuration(raw) {
    if (!raw) return null;
    raw = raw.trim();
    if (!raw) return null;
    if (/^\d+$/.test(raw)) {
      let sec = parseInt(raw, 10);
      const h = Math.floor(sec / 3600); sec %= 3600;
      const m = Math.floor(sec / 60); const s = sec % 60;
      return h > 0
        ? `${h}h${String(m).padStart(2,'0')}`
        : `${m}min${String(s).padStart(2,'0')}`;
    }
    const parts = raw.split(':').map(p => parseInt(p, 10));
    if (parts.some(isNaN)) return null;
    if (parts.length === 3) {
      const [h, m] = parts;
      return h > 0 ? `${h}h${String(m).padStart(2,'0')}` : `${m}min`;
    }
    if (parts.length === 2) {
      const [m, s] = parts;
      return `${m}min${String(s).padStart(2,'0')}`;
    }
    return null;
  }

  function getChannelImage(xml) {
    const channel = xml.querySelector('channel');
    if (!channel) return null;
    // itunes:image href="..."
    let el = channel.getElementsByTagName('itunes:image')[0];
    if (!el) {
      const all = channel.getElementsByTagName('*');
      for (const n of all) { if (n.localName === 'image' && n.getAttribute('href')) { el = n; break; } }
    }
    if (el && el.getAttribute('href')) return el.getAttribute('href');
    // <image><url>...</url></image>
    const urlEl = channel.querySelector('image > url');
    if (urlEl && urlEl.textContent) return urlEl.textContent.trim();
    return null;
  }

  function getItunesDuration(item) {
    let el = item.getElementsByTagName('itunes:duration')[0];
    if (!el) {
      const all = item.getElementsByTagName('*');
      for (const n of all) { if (n.localName === 'duration') { el = n; break; } }
    }
    return el ? el.textContent : null;
  }

  async function analyzeFeedUrl(url) {
    const text = await fetchFeedText(url);
    const xml = new DOMParser().parseFromString(text, 'text/xml');
    if (xml.querySelector('parsererror')) throw new Error('Flux XML invalide');

    const podcastTitle = xml.querySelector('channel > title')?.textContent || 'Podcast';
    const podcastCover = getChannelImage(xml);
    const items = xml.querySelectorAll('item');
    if (items.length === 0) throw new Error('Aucun épisode trouvé dans ce flux');

    const today = new Date();
    today.setHours(0,0,0,0);

    // 7 derniers jours : index 0 = aujourd'hui ... index 6 = il y a 6 jours
    const days = [];
    for (let i = 0; i <= 6; i++) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      days.push({ date: d, count: 0 });
    }

    const todayEpisodes = [];
    let hasValidDates = false;

    items.forEach(item => {
      const pubDateStr = item.querySelector('pubDate')?.textContent;
      if (!pubDateStr) return;
      const pubDate = new Date(pubDateStr);
      if (isNaN(pubDate)) return;
      hasValidDates = true;

      const dayEntry = days.find(d => isSameDay(d.date, pubDate));
      if (dayEntry) dayEntry.count++;

      if (isSameDay(pubDate, today)) {
        todayEpisodes.push({
          time: pubDate.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
          date: pubDate,
          title: item.querySelector('title')?.textContent || 'Sans titre',
          duration: formatDuration(getItunesDuration(item)),
          link: item.querySelector('link')?.textContent || item.querySelector('enclosure')?.getAttribute('url') || url
        });
      }
    });

    if (!hasValidDates) throw new Error("Ce flux ne fournit pas de dates de publication exploitables");
    todayEpisodes.sort((a, b) => b.date - a.date);

    return { url, title: podcastTitle, cover: podcastCover, today, days, todayEpisodes };
  }

  async function analyze() {
    const input = document.getElementById('feed-input');
    const url = input.value.trim();
    if (!url) { setStatus('Merci de coller une URL de flux RSS.', true); return; }

    const btn = document.getElementById('analyze-btn');
    btn.disabled = true;
    setStatus('Analyse en cours…');
    setProgress(15);
    document.getElementById('result-head').classList.remove('show');
    document.getElementById('result-cover').removeAttribute('src');
    document.getElementById('stats').classList.remove('show');
    document.getElementById('list-head').classList.remove('show');
    document.getElementById('content-area').innerHTML = '';

    try {
      const result = await analyzeFeedUrl(url);
      setProgress(80);

      // --- Affichage résultat ---
      document.getElementById('result-title').textContent = result.title;
      const coverEl = document.getElementById('result-cover');
      if (result.cover) { coverEl.src = result.cover; coverEl.alt = result.title; }
      else { coverEl.removeAttribute('src'); }
      const feedLinkEl = document.getElementById('result-feedlink');
      feedLinkEl.href = url;
      feedLinkEl.textContent = url;
      document.getElementById('result-head').classList.add('show');

      const statsEl = document.getElementById('stats');
      statsEl.innerHTML = result.days.map(d => {
        const isToday = isSameDay(d.date, result.today);
        const label = isToday ? "Aujourd'hui" : DAY_NAMES[d.date.getDay()];
        return `
          <div class="stat${isToday ? ' is-today' : ''}">
            <div class="stat-num mono">${d.count}</div>
            <div class="stat-label">${label}</div>
          </div>`;
      }).join('');
      statsEl.classList.add('show');

      document.getElementById('list-head').classList.add('show');
      const area = document.getElementById('content-area');
      if (result.todayEpisodes.length === 0) {
        area.innerHTML = '<div class="empty">Aucun épisode publié aujourd\'hui</div>';
      } else {
        area.innerHTML = result.todayEpisodes.map(ep => `
          <div class="row">
            <div class="row-time mono">${ep.time}</div>
            <div class="row-body">
              <div class="row-title">${escapeHtml(ep.title)}</div>
              <div class="row-duration mono">${ep.duration ? escapeHtml(ep.duration) : 'durée non précisée'}</div>
            </div>
            <a href="${ep.link}" target="_blank" rel="noopener" class="row-link">Écouter →</a>
          </div>
        `).join('');
      }

      setProgress(100);
      setStatus('');
      saveToHistory(url, result.title, result.cover);
      renderHistory();
    } catch (e) {
      setStatus(e.message || 'Erreur lors de l\'analyse de ce flux', true);
      setProgress(0);
    } finally {
      btn.disabled = false;
      setTimeout(() => setProgress(0), 500);
    }
  }

  document.getElementById('feed-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') analyze();
  });

  // --- Historique (localStorage) ---
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
    catch (e) { return []; }
  }

  function saveToHistory(url, title, cover) {
    let hist = loadHistory();
    hist = hist.filter(h => h.url !== url);
    hist.unshift({ url, title, cover: cover || null, ts: Date.now() });
    hist = hist.slice(0, 25);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
  }

  function removeFromHistory(url, e) {
    e.stopPropagation();
    let hist = loadHistory().filter(h => h.url !== url);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
    renderHistory();
  }

  function useHistoryEntry(url) {
    document.getElementById('feed-input').value = url;
    analyze();
  }

  function renderHistory() {
    const hist = loadHistory();
    const container = document.getElementById('history-container');
    if (hist.length === 0) {
      container.innerHTML = '<div class="history-empty">Aucun flux analysé pour l\'instant</div>';
    } else {
      container.innerHTML = `<div class="history-list">${hist.map(h => `
        <div class="history-item" onclick="useHistoryEntry('${h.url.replace(/'/g, "\\'")}')">
          <div class="history-name">${escapeHtml(h.title)}</div>
          <div class="history-url mono">${escapeHtml(h.url)}</div>
          <button class="history-remove" onclick="removeFromHistory('${h.url.replace(/'/g, "\\'")}', event)">retirer</button>
        </div>
      `).join('')}</div>`;
    }
    renderCompareSelectors();
  }

  // --- Comparateur ---
  function renderCompareSelectors() {
    const hist = loadHistory();
    const selA = document.getElementById('compare-select-a');
    const selB = document.getElementById('compare-select-b');
    const valA = selA.value, valB = selB.value;

    [selA, selB].forEach((sel, idx) => {
      const otherVal = idx === 0 ? valB : valA;
      sel.innerHTML = '<option value="">Choisir un podcast…</option>' + hist.map(h =>
        `<option value="${escapeHtml(h.url)}" ${h.url === otherVal ? 'disabled' : ''}>${escapeHtml(h.title)}</option>`
      ).join('');
    });
    selA.value = hist.some(h => h.url === valA) ? valA : '';
    selB.value = hist.some(h => h.url === valB) ? valB : '';
  }

  function onCompareSelectChange() {
    renderCompareSelectors();
    const urlA = document.getElementById('compare-select-a').value;
    const urlB = document.getElementById('compare-select-b').value;
    const resultEl = document.getElementById('compare-result');
    const statusEl = document.getElementById('compare-status');

    if (!urlA || !urlB) {
      resultEl.innerHTML = '';
      statusEl.textContent = '';
      statusEl.classList.remove('err');
      return;
    }
    runCompare(urlA, urlB);
  }

  async function runCompare(urlA, urlB) {
    const statusEl = document.getElementById('compare-status');
    const resultEl = document.getElementById('compare-result');
    statusEl.textContent = 'Comparaison en cours…';
    statusEl.classList.remove('err');
    resultEl.innerHTML = '';

    try {
      const [a, b] = await Promise.all([analyzeFeedUrl(urlA), analyzeFeedUrl(urlB)]);

      const headRow = `<div class="compare-head-row"><div></div>${a.days.map(d => {
        const isToday = isSameDay(d.date, a.today);
        const label = isToday ? "Aujourd'hui" : DAY_NAMES[d.date.getDay()];
        return `<div class="compare-daylabel${isToday ? ' is-today' : ''}">${label}</div>`;
      }).join('')}</div>`;

      const podcastRow = (p) => `
        <div class="compare-row">
          <div class="compare-podcast">
            <img class="compare-cover" ${p.cover ? `src="${p.cover}"` : ''} alt="">
            <div class="compare-podcast-name">${escapeHtml(p.title)}</div>
          </div>
          ${p.days.map(d => {
            const isToday = isSameDay(d.date, p.today);
            return `<div class="compare-cell${isToday ? ' is-today' : ''}">${d.count}</div>`;
          }).join('')}
        </div>`;

      resultEl.innerHTML = headRow + podcastRow(a) + podcastRow(b);
      statusEl.textContent = '';
    } catch (e) {
      statusEl.textContent = e.message || 'Erreur lors de la comparaison';
      statusEl.classList.add('err');
    }
  }

  renderHistory();
</script>
</body>
</html>
