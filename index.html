<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcast Fighter II Turbo</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0e27;
      color: #00ff88;
      font-family: 'Orbitron', sans-serif;
      min-height: 100vh;
      letter-spacing: 0.5px;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated Space Background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 50%, rgba(255, 0, 255, 0.1) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
                  #0a0e27;
      z-index: -2;
      pointer-events: none;
    }

    /* Starfield */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 60px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 50px 50px, #ddd, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 10px, #eee, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      z-index: -1;
      pointer-events: none;
      animation: twinkleStars 3s infinite;
    }

    @keyframes twinkleStars {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }

    /* Side Arcade Cabinets */
    .arcade-cabinet {
      position: fixed;
      top: 0;
      width: 80px;
      height: 100vh;
      background: linear-gradient(90deg, #1a0033 0%, #2d0052 50%, #1a0033 100%);
      border: 3px solid #ff00ff;
      box-shadow: 0 0 20px #ff00ff, inset 0 0 20px rgba(255, 0, 255, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 20px 0;
      z-index: 100;
    }

    .arcade-cabinet.left {
      left: 0;
      border-right: 3px solid #ff00ff;
      border-left: none;
    }

    .arcade-cabinet.right {
      right: 0;
      border-left: 3px solid #ff00ff;
      border-right: none;
    }

    .arcade-button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffff00, #ffaa00);
      border: 2px solid #ff6600;
      box-shadow: 0 0 15px #ffff00, inset -2px -2px 5px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      animation: buttonPulse 2s infinite;
    }

    @keyframes buttonPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .arcade-coin {
      font-size: 24px;
      animation: coinSpin 3s linear infinite;
    }

    @keyframes coinSpin {
      0%, 100% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
    }

    /* Logo Section */
    .logo-section {
      text-align: center;
      margin-bottom: 60px;
      margin-left: 80px;
      margin-right: 80px;
      animation: glitchEffect 0.6s ease-out;
      position: relative;
    }

    @keyframes glitchEffect {
      0% {
        opacity: 0;
        transform: translateY(-30px);
      }
      50% {
        text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff;
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      max-width: 420px;
      height: auto;
      margin: 0 auto;
      filter: drop-shadow(0 0 20px #ff00ff) drop-shadow(0 0 10px #00ffff);
    }

    /* Navigation */
    .nav-arcade {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 80px;
      flex-wrap: wrap;
      background: rgba(0, 20, 50, 0.6);
      padding: 15px 20px;
      border: 2px solid #00ffff;
      border-radius: 8px;
      box-shadow: 0 0 20px #00ffff, inset 0 0 15px rgba(0, 255, 255, 0.2);
    }

    .nav-button {
      padding: 8px 16px;
      background: linear-gradient(135deg, #ff00ff 0%, #ff0088 100%);
      color: #fff;
      border: 2px solid #ff00ff;
      border-radius: 4px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.3s;
      box-shadow: 0 0 10px #ff00ff;
      letter-spacing: 1px;
    }

    .nav-button:hover {
      background: linear-gradient(135deg, #ff0088 0%, #ff00ff 100%);
      box-shadow: 0 0 20px #ff00ff, 0 0 30px #00ffff;
      transform: translateY(-2px);
    }

    /* Input Section - Arena Layout */
    .input-wrapper {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 20px;
      margin: 40px 80px;
      align-items: center;
      background: rgba(0, 20, 50, 0.4);
      padding: 30px;
      border: 2px solid #00ffff;
      border-radius: 8px;
      box-shadow: 0 0 30px #00ffff, inset 0 0 20px rgba(0, 255, 255, 0.1);
    }

    .input-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #00ffff;
      text-align: center;
      text-shadow: 0 0 10px #00ffff;
    }

    .input-box {
      width: 100%;
    }

    .input-box input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #00ffff;
      background: rgba(0, 20, 50, 0.8);
      color: #00ff88;
      font-size: 13px;
      border-radius: 4px;
      transition: all 0.3s ease;
      font-family: 'Orbitron', monospace;
      box-shadow: 0 0 10px #00ffff inset;
    }

    .input-box input:focus {
      outline: none;
      border-color: #ff00ff;
      box-shadow: 0 0 20px #ff00ff, 0 0 10px #ff00ff inset;
      background: rgba(0, 20, 50, 0.9);
    }

    .input-box input::placeholder {
      color: #00aa66;
    }

    /* Versus Section - Center */
    .versus-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .versus-icon {
      font-size: 52px;
      line-height: 1;
      animation: arcadeLightning 0.5s infinite;
      text-shadow: 0 0 20px #00ffff, 0 0 10px #ff00ff;
    }

    @keyframes arcadeLightning {
      0%, 100% {
        text-shadow: 0 0 20px #00ffff, 0 0 10px #ff00ff;
        transform: scale(1);
      }
      50% {
        text-shadow: 0 0 30px #ffff00, 0 0 20px #ff00ff;
        transform: scale(1.1);
      }
    }

    .versus-text {
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
      color: #00ffff;
      letter-spacing: 2px;
      text-shadow: 0 0 20px #00ffff, 0 0 10px #ff00ff;
      font-family: 'Press Start 2P', cursive;
    }

    /* Button */
    .btn-container {
      text-align: center;
      margin: 40px 80px;
    }

    .btn-insert-coin {
      padding: 16px 56px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffff00 0%, #ffaa00 100%);
      border: 3px solid #ff6600;
      color: #000;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s;
      box-shadow: 0 0 20px #ffff00, 0 6px 20px rgba(255, 170, 0, 0.4);
      letter-spacing: 1px;
      font-family: 'Orbitron', sans-serif;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .btn-insert-coin:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 30px #ffff00, 0 0 20px #ff00ff, 0 10px 25px rgba(255, 170, 0, 0.5);
      text-shadow: 0 0 10px #ff00ff, 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .btn-insert-coin:active {
      transform: translateY(-1px);
      box-shadow: 0 0 25px #ffff00, 0 4px 15px rgba(255, 170, 0, 0.4);
    }

    /* Results Section */
    .results-section {
      display: none;
      animation: scanlineFlicker 0.15s infinite;
      margin-left: 80px;
      margin-right: 80px;
    }

    @keyframes scanlineFlicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.98; }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Podcast Cards */
    .podcast-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 60px;
      margin-top: 0;
    }

    .podcast-card {
      background: linear-gradient(135deg, rgba(0, 50, 100, 0.4) 0%, rgba(100, 0, 150, 0.2) 100%);
      border: 2px solid #ff00ff;
      padding: 32px 28px;
      border-radius: 4px;
      box-shadow: 0 0 20px #ff00ff, inset 0 0 15px rgba(255, 0, 255, 0.1);
      text-align: center;
      transition: all 0.3s ease;
    }

    .podcast-card:hover {
      border-color: #00ffff;
      box-shadow: 0 0 30px #ff00ff, 0 0 20px #00ffff, inset 0 0 20px rgba(255, 0, 255, 0.15);
      transform: translateY(-4px);
    }

    .podcast-image {
      width: 140px;
      height: 140px;
      margin: 0 auto 20px;
      border: 3px solid #00ffff;
      overflow: hidden;
      background: radial-gradient(circle, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px #00ffff, inset 0 0 10px rgba(0, 255, 255, 0.2);
    }

    .podcast-card:hover .podcast-image {
      transform: scale(1.08);
      box-shadow: 0 0 25px #ff00ff, 0 0 15px #00ffff, inset 0 0 15px rgba(255, 0, 255, 0.3);
      border-color: #ff00ff;
    }

    .podcast-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .podcast-title {
      font-size: 1.2em;
      font-weight: 700;
      margin-bottom: 10px;
      color: #00ffff;
      line-height: 1.3;
      text-shadow: 0 0 10px #00ffff;
    }

    .podcast-description {
      font-size: 0.85em;
      color: #00dd88;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .podcast-episodes-count {
      font-size: 0.8em;
      color: #ffff00;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-shadow: 0 0 8px #ffff00;
    }

    /* Episodes Today Section */
    .episodes-today {
      background: linear-gradient(135deg, rgba(0, 50, 100, 0.3) 0%, rgba(100, 0, 150, 0.2) 100%);
      border: 2px solid #00ffff;
      padding: 40px 36px;
      border-radius: 4px;
      box-shadow: 0 0 25px #00ffff, inset 0 0 15px rgba(0, 255, 255, 0.1);
      margin-bottom: 60px;
      width: 100%;
    }

    .section-title {
      font-size: 1em;
      font-weight: 700;
      margin-bottom: 28px;
      color: #ffff00;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      text-shadow: 0 0 10px #ffff00;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-bottom: 0;
      width: 100%;
    }

    .episodes-list {
      text-align: left;
      display: flex;
      flex-direction: column;
      min-height: 460px;
      padding: 28px 32px;
      background: linear-gradient(135deg, rgba(0, 30, 60, 0.4) 0%, rgba(60, 0, 100, 0.3) 100%);
      border-radius: 4px;
      border: 2px solid #ff00ff;
      transition: all 0.3s ease;
      width: 100%;
      box-shadow: 0 0 15px #ff00ff, inset 0 0 10px rgba(255, 0, 255, 0.1);
    }

    .episodes-list:hover {
      border-color: #00ffff;
      box-shadow: 0 0 25px #ff00ff, 0 0 15px #00ffff, inset 0 0 15px rgba(0, 255, 255, 0.1);
    }

    .episodes-list h4 {
      font-size: 0.95em;
      color: #00ffff;
      margin-bottom: 24px;
      font-weight: 700;
      padding-bottom: 14px;
      border-bottom: 2px solid #ff00ff;
      text-align: center;
      letter-spacing: 1px;
      text-shadow: 0 0 8px #ff00ff;
    }

    .episodes-list:nth-child(1) h4 {
      color: #ff00ff;
      border-bottom-color: #ff00ff;
      text-shadow: 0 0 8px #ff00ff;
    }

    .episodes-list:nth-child(2) h4 {
      color: #ffff00;
      border-bottom-color: #ffff00;
      text-shadow: 0 0 8px #ffff00;
    }

    .episode-item {
      background: rgba(0, 50, 100, 0.3);
      padding: 14px 16px;
      margin-bottom: 12px;
      border-left: 3px solid #ff00ff;
      border-radius: 2px;
      font-size: 0.9em;
      line-height: 1.6;
      color: #00ff88;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(255, 0, 255, 0.2);
      transition: all 0.3s ease;
    }

    .episode-item:hover {
      box-shadow: 0 0 15px #ff00ff, 0 0 8px #00ffff;
      transform: translateX(4px);
      border-left-color: #00ffff;
    }

    .episodes-list:nth-child(2) .episode-item {
      border-left-color: #ffd709;
      color: #7f8c8d;
      font-style: italic;
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 70px;
      text-align: center;
    }

    .duration-box {
      background: linear-gradient(135deg, rgba(0, 30, 60, 0.3) 0%, rgba(100, 0, 150, 0.2) 100%);
      padding: 28px 24px;
      border-radius: 4px;
      text-align: center;
      margin-top: auto;
      border: 2px solid #00ffff;
      box-shadow: 0 0 12px #00ffff, inset 0 0 8px rgba(0, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .duration-label {
      font-size: 0.65em;
      color: #00ffff;
      margin-bottom: 12px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 0 6px #00ffff;
    }

    .duration-value {
      font-size: 2.8em;
      font-weight: 900;
      color: #ff00ff;
      line-height: 1;
      text-shadow: 0 0 12px #ff00ff;
    }

    .episodes-list:nth-child(2) .duration-value {
      color: #ffff00;
      text-shadow: 0 0 12px #ffff00;
    }

    /* Timeline Section */
    .timeline-section {
      background: linear-gradient(135deg, rgba(0, 50, 100, 0.3) 0%, rgba(100, 0, 150, 0.2) 100%);
      border: 2px solid #00ffff;
      padding: 40px 36px;
      border-radius: 4px;
      box-shadow: 0 0 25px #00ffff, inset 0 0 15px rgba(0, 255, 255, 0.1);
      margin-bottom: 60px;
    }

    .timeline-container {
      display: flex;
      gap: 32px;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 36px;
      height: 220px;
      flex-wrap: nowrap;
      overflow-x: visible;
      padding: 20px 0;
      width: 100%;
    }

    .timeline-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 85px;
      flex: 1;
      flex-shrink: 0;
    }

    .bar-label {
      font-size: 0.75em;
      color: #00dd88;
      text-align: center;
      width: 100%;
      order: 3;
      font-weight: 600;
      text-shadow: 0 0 6px #00dd88;
    }

    .bar-container {
      width: 100%;
      max-width: 80px;
      height: 150px;
      background: rgba(0, 20, 50, 0.4);
      border-radius: 2px;
      display: flex;
      gap: 3px;
      padding: 5px;
      order: 2;
      box-shadow: 0 0 10px #00ffff inset, 0 0 8px rgba(0, 255, 255, 0.2);
      justify-content: space-between;
      align-items: flex-end;
      transition: all 0.3s ease;
      border: 1px solid #00ffff;
    }

    .timeline-bar:hover .bar-container {
      box-shadow: 0 0 20px #ff00ff, 0 0 10px #00ffff inset;
      border-color: #ff00ff;
    }

    .bar {
      flex: 1;
      border-radius: 1px;
      transition: all 0.3s ease;
      color: #fff;
      font-size: 0.7em;
      font-weight: 700;
      min-height: 2px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 1px;
    }

    .bar-1 {
      background: linear-gradient(180deg, #ff00ff, #ff0088);
      box-shadow: 0 0 8px #ff00ff;
    }

    .bar-2 {
      background: linear-gradient(180deg, #ffff00, #ffaa00);
      box-shadow: 0 0 8px #ffff00;
    }

    .bar:hover {
      filter: brightness(1.2);
      box-shadow: 0 2px 8px rgba(255, 0, 255, 0.4);
    }

    /* Heatmap Section */
    .heatmap-section {
      background: linear-gradient(135deg, rgba(0, 50, 100, 0.3) 0%, rgba(100, 0, 150, 0.2) 100%);
      border: 2px solid #00ffff;
      padding: 40px 36px;
      border-radius: 4px;
      box-shadow: 0 0 25px #00ffff, inset 0 0 15px rgba(0, 255, 255, 0.1);
      margin-bottom: 60px;
    }

    .heatmap-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-top: 28px;
    }

    .heatmap-column h4 {
      margin-bottom: 20px;
      color: #ffff00;
      font-weight: 700;
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 8px #ffff00;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      background: linear-gradient(135deg, rgba(0, 100, 200, 0.3), rgba(200, 0, 100, 0.2));
      border: 2px solid #00ffff;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: default;
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.2);
    }

    .day-label {
      font-size: 0.6em;
      color: #00ff88;
      margin-top: 4px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 0 0 4px #00ff88;
    }

    .day-count {
      font-size: 1.1em;
      font-weight: 900;
      color: #ff00ff;
      text-shadow: 0 0 8px #ff00ff;
    }

    .day-cell:hover {
      border-color: #ff00ff;
      box-shadow: 0 0 20px #ff00ff, 0 0 10px #00ffff;
      transform: scale(1.1);
    }

    .error {
      color: #ff4466;
      padding: 12px 16px;
      background: rgba(255, 0, 100, 0.2);
      border-radius: 4px;
      border: 2px solid #ff0066;
      margin-top: 12px;
      font-size: 0.85em;
      font-weight: 600;
      text-shadow: 0 0 6px #ff0066;
    }

    .success {
      color: #00ff88;
      margin-top: 12px;
      font-size: 0.85em;
      font-weight: 600;
      text-shadow: 0 0 6px #00ff88;
    }

    /* Fight Button */
    .fight-button-container {
      display: flex;
      justify-content: center;
      margin: 80px 80px 60px;
    }

    .btn-fight {
      padding: 16px 60px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ff00ff 0%, #ff0088 100%);
      border: 3px solid #ffff00;
      color: #fff;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s;
      box-shadow: 0 0 25px #ff00ff, 0 0 15px #ffff00;
      letter-spacing: 1.2px;
      font-family: 'Orbitron', sans-serif;
      text-shadow: 0 0 10px #ff00ff;
    }

    .btn-fight:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 35px #ff00ff, 0 0 25px #ffff00, 0 0 15px #00ffff, 0 8px 20px rgba(255, 0, 255, 0.4);
      text-shadow: 0 0 15px #ff00ff, 0 0 8px #ffff00;
    }

    .btn-fight:active {
      transform: translateY(-1px);
    }

    /* Fight Modal */
    .fight-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #0a0e27;
      z-index: 1000;
      animation: fadeIn 0.3s ease-in;
      border: 4px solid #ff00ff;
      box-shadow: inset 0 0 60px rgba(255, 0, 255, 0.3);
    }

    .fight-modal.show {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .fight-content {
      max-width: 900px;
      text-align: center;
      color: #00ffff;
      padding: 40px;
    }

    .round-title {
      font-size: 3.5em;
      font-weight: 900;
      margin-bottom: 40px;
      color: #ffff00;
      letter-spacing: 2px;
      font-family: 'Press Start 2P', cursive;
      text-shadow: 0 0 30px #ffff00, 0 0 20px #ff00ff;
      animation: glitch 0.3s infinite;
    }

    @keyframes glitch {
      0%, 100% {
        text-shadow: 0 0 30px #ffff00, 0 0 20px #ff00ff;
      }
      50% {

        transform: translateY(0);

    .history-button {

    .history-modal {

      height: 40px;

      justify-content: center;

    }

    .history-close-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px #ff00ff, 0 0 15px #ffff00;
    }

    .history-battles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .battle-card {

      align-items: center;
      gap: 10px;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
    }

    .battle-card:hover {
      transform: translateY(-4px);
      border-color: #ff00ff;

    }

    .battle-images {

      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .battle-image {

      border-radius: 8px;

      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;

    }

    .battle-image img {
      width: 100%;
      height: 100%;

    }

    }

    .history-empty {
